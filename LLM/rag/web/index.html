<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DocLens — 근거를 찾는 문서 워크스페이스</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f7fb;color:#222336;font:14px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif}button,input{font:inherit}button{cursor:pointer;border:0}aside{background:#fff;border-right:1px solid #e7e7ef;width:238px;height:100vh;padding:30px 22px;position:fixed}.brand{font-size:25px;font-weight:800;letter-spacing:-1px}.logo{display:inline-grid;place-items:center;background:#6554d9;color:white;width:32px;height:32px;border-radius:10px;margin-right:9px}.muted{color:#9093a6}.tiny{font-size:11px;letter-spacing:1.8px;font-weight:700}.side-label{margin:42px 0 16px}.doc{padding:16px 12px;margin-bottom:10px;border-radius:10px;background:#f1effd;border:1px solid #ddd6ff;cursor:pointer;line-height:1.7;overflow-wrap:anywhere}.doc small{display:block;color:#858498}.add{width:100%;padding:12px;background:#fff;border:1px dashed #b9b4d3;border-radius:8px;color:#6657b5}.aside-foot{position:absolute;bottom:28px;font-size:11px;line-height:1.9;color:#9294a4}main{margin-left:238px}header{height:86px;background:#fff;border-bottom:1px solid #e7e7ef;display:flex;align-items:center;justify-content:space-between;padding:0 34px}.crumb{color:#9496a5;font-size:12px}.status{font-size:11px;color:#398974;background:#eef9f5;padding:8px 12px;border-radius:30px}.workspace{padding:32px;display:grid;grid-template-columns:minmax(450px,1fr) 326px;gap:24px}h1{font-size:29px;letter-spacing:-1.2px;margin:10px 0 12px}h2{font-size:17px;letter-spacing:-.3px}.lead{color:#7c8094;font-size:13px;margin-bottom:25px}.conversation{min-height:538px;background:#fff;border:1px solid #e8e7ef;border-radius:14px;padding:25px}.q{padding:17px 19px;border-radius:11px;background:#f4f2fe;color:#4f419a;font-weight:600;margin-bottom:28px;line-height:1.6}.assistant-label{font-size:12px;font-weight:700;color:#6554d9;display:flex;align-items:center;gap:10px}.answer{white-space:pre-wrap;line-height:1.95;font-size:14px;margin:16px 0 22px}.metrics{border-top:1px solid #ecebf2;padding-top:16px;color:#9292a7;font-size:11px;display:flex;gap:20px}.composer{display:flex;gap:10px;margin-top:26px;border:1px solid #dad6ed;padding:8px;border-radius:11px;background:white}.composer input{border:0;background:none;outline:0;padding:10px;flex:1;min-width:0}.primary{background:#6554d9;color:white;padding:12px 18px;border-radius:8px}.sources{padding-top:100px}.sources-head{display:flex;justify-content:space-between;align-items:center}.source{background:#fff;border:1px solid #e5e4ed;border-radius:11px;padding:17px;margin:13px 0}.source-head{display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:#6c5ec2}.source p{font-size:12px;line-height:1.8;color:#777c90;max-height:104px;overflow:auto}.source a{color:#7163c5;font-size:11px;text-decoration:none}.empty{padding:70px 20px;text-align:center;color:#9092a5;line-height:1.8}.error{color:#c74456;font-size:12px;min-height:22px;margin-top:9px}.activity{font-size:11px;color:#85889d;margin-top:15px}a{color:inherit}.source-count{font-size:11px;color:#8d8d9e}@media(max-width:1050px){aside{width:200px}main{margin-left:200px}.workspace{grid-template-columns:1fr}.sources{padding:0}.source{display:inline-block;width:47%;vertical-align:top;margin-right:2%}}
</style>
<aside><div class="brand"><span class="logo">D</span>DocLens</div><div class="tiny muted side-label">KNOWLEDGE LIBRARY</div><div id="documents"></div><button class="add" id="uploadButton">＋ PDF 문서 추가</button><input type="file" id="file" accept="application/pdf" hidden><div class="aside-foot">내 문서에서 찾고, 근거로 답합니다.<br>문서 · 질문 · 답변 저장</div></aside>
<main><header><div class="crumb">워크스페이스 &nbsp; / &nbsp; <strong style="color:#55556d">문서 질의응답</strong></div><span class="status" id="health">연결 확인 중</span></header><div class="workspace"><section><div class="tiny muted">DOCUMENT INTELLIGENCE</div><h1>답변의 근거까지, 한눈에.</h1><p class="lead" id="docMeta">PDF를 추가하면 검색한 원문과 답변을 나란히 확인할 수 있습니다.</p><div class="conversation"><div id="thread"><div class="empty">문서에서 무엇을 찾고 싶으신가요?<br>왼쪽에서 PDF를 추가해 시작하세요.</div></div><form id="askForm" class="composer"><input id="question" aria-label="문서에 질문" placeholder="이 문서에 대해 질문해 보세요" required minlength="3" maxlength="1200"><button class="primary" id="send">질문하기 ↗</button></form><div id="error" class="error" role="status"></div></div><div class="activity" id="activity">원문 페이지를 열어 답변의 근거를 직접 확인하세요.</div></section><section class="sources"><div class="sources-head"><h2>참조한 원문</h2><span class="source-count" id="sourceCount">0개 출처</span></div><div id="sources"><div class="empty">질문하면 관련 본문을<br>이곳에서 보여드립니다.</div></div></section></div></main>
<script>
const $=s=>document.querySelector(s);let selected=null;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,options={}){const r=await fetch('/api'+path,options);const d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:'요청을 처리하지 못했습니다.');return d}
async function refresh(id){const docs=await api('/documents');$('#documents').innerHTML=docs.map(d=>`<div class="doc" tabindex="0" role="button" data-id="${d.id}"><b>▤ &nbsp;${esc(d.name)}</b><small>${d.pages}페이지 · ${d.chunks}개 검색 단위</small></div>`).join('');if(docs.length){selected=docs.find(d=>d.id==id)||docs[0];$('#docMeta').textContent=`${selected.name} · ${selected.pages}페이지 · ${selected.chunks}개 검색 단위` ;const h=await api(`/documents/${selected.id}/questions`);if(h.length)render(h.at(-1));else{$('#thread').innerHTML='<div class="empty">문서 준비가 끝났습니다.<br>첫 번째 질문을 입력해 보세요.</div>';$('#sources').innerHTML='';$('#sourceCount').textContent='0개 출처'}}}
function render(d){$('#thread').innerHTML=`<div class="q">${esc(d.question)}</div><div class="assistant-label"><span class="logo" style="width:24px;height:24px;font-size:12px">D</span>문서 기반 답변</div><div class="answer">${esc(d.answer)}</div><div class="metrics"><span>검색 → 답변 ${(d.latency_ms/1000).toFixed(1)}초</span><span>입력 ${d.input_tokens.toLocaleString()} · 출력 ${d.output_tokens} tokens</span></div>`;$('#sources').innerHTML=d.sources.map(s=>`<article class="source"><div class="source-head"><span>[${s.id}] PDF ${s.page}페이지</span><span>유사도 ${s.similarity.toFixed(3)}</span></div><p>${esc(s.text)}</p><a target="_blank" rel="noopener" href="/api/documents/${selected.id}/file#page=${s.page}">원문 페이지 열기 ↗</a></article>`).join('');$('#sourceCount').textContent=d.sources.length+'개 출처';$('#activity').textContent='질문과 답변을 저장했습니다. 문서를 다시 열어도 이어서 확인할 수 있습니다.'}
$('#documents').onclick=e=>{const d=e.target.closest('[data-id]');if(d)refresh(Number(d.dataset.id))};$('#documents').onkeydown=e=>{if(e.key==='Enter')e.target.click()};$('#uploadButton').onclick=()=>$('#file').click();$('#file').onchange=async()=>{if(!$('#file').files[0])return;const form=new FormData();form.append('file',$('#file').files[0]);$('#error').textContent='문서를 읽고 검색용 인덱스를 만드는 중입니다…';$('#uploadButton').disabled=true;try{const d=await api('/documents',{method:'POST',body:form});await refresh(d.id);$('#error').textContent=''}catch(e){$('#error').textContent=e.message}finally{$('#uploadButton').disabled=false;$('#file').value=''}};
$('#askForm').onsubmit=async e=>{e.preventDefault();if(!selected){$('#error').textContent='먼저 문서를 추가해 주세요.';return}$('#send').disabled=true;$('#error').textContent='관련 본문을 검색하고 답변을 작성 중입니다…';try{render(await api(`/documents/${selected.id}/questions`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:$('#question').value})}));$('#question').value='';$('#error').textContent=''}catch(e){$('#error').textContent=e.message}finally{$('#send').disabled=false}};
refresh().catch(e=>$('#error').textContent=e.message);api('/health').then(d=>$('#health').textContent=d.api_configured?(d.provider==='local'?'● 로컬 AI 모드':'● API 설정됨'):'API 키 설정 필요');
</script></html>
