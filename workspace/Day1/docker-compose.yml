services:
  web:
    image: board-web:latest
    build:
      context: ./WEB
    ports:
      - "8080:80"
    depends_on:
      - was

  was:
    image: board-was:latest
    build:
      context: ./WAS
    environment:
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: board
      DB_USER: board_user
      DB_PASSWORD: board_password
    expose:
      - "5000"
    networks:
      default:
        aliases:
          - board-was
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: board
      POSTGRES_USER: board_user
      POSTGRES_PASSWORD: board_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./DB/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U board_user -d board"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
